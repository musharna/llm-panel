name: Bug report
description: Something misbehaved — a judge misreported, a render broke, a control lies
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: >
        If a judge failed, say which class the panel reported (refused vs harness) —
        the distinction matters here.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The command you ran. Attach the run directory's panel.md if you have it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `llm-panel --version`, plus your Python version.
    validations:
      required: true
