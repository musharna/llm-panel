name: Feature request
description: A transport, a report view, a benchmark arm, anything
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What should it do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What would you use it for?
      description: >
        A concrete session where you needed it beats a general argument. Note the
        design stance in the README's "Known limitations" before proposing a voting
        or auto-summarizing feature — the tool deliberately has neither.
