name: controls

on:
  push:
    branches: [main]
  pull_request:

jobs:
  controls:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # Every suite is pure stdlib and offline; each exits non-zero on any failing
      # control. Run all seven even if one fails, so a red run names every broken suite.
      - name: llm-panel-controls
        run: python llm-panel-controls
      - name: panel-report-controls
        if: ${{ !cancelled() }}
        run: python panel-report-controls
      - name: panel-triage-controls
        if: ${{ !cancelled() }}
        run: python panel-triage-controls
      - name: claimlib-controls
        if: ${{ !cancelled() }}
        run: python claimlib-controls
      - name: aacr-upstream-controls
        if: ${{ !cancelled() }}
        run: python recall/aacr-upstream-controls
      - name: aacr-recut-controls
        if: ${{ !cancelled() }}
        run: python recall/aacr-recut-controls
      - name: privacy-controls
        if: ${{ !cancelled() }}
        run: python privacy-controls
