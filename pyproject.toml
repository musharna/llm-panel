[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-panel"
dynamic = ["version"]
description = "Put one question to several LLMs independently and read every answer in full -- parallel judges, failure classes, cost, and an anonymised rebuttal round"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Jaret Arnold" }]
keywords = ["llm", "panel", "code-review", "multi-model", "judge", "openrouter", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/musharna/llm-panel"
Issues = "https://github.com/musharna/llm-panel/issues"
Changelog = "https://github.com/musharna/llm-panel/blob/main/CHANGELOG.md"

[project.scripts]
llm-panel = "llm_panel.cli:llm_panel"
panel-report = "llm_panel.cli:panel_report"
panel-triage = "llm_panel.cli:panel_triage"

# Single version source: the __version__ line in the llm-panel script itself.
[tool.hatch.version]
source = "regex"
path = "llm-panel"
pattern = '^__version__ = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["src/llm_panel"]

# The tools stay single files at the repo root; the wheel ships verbatim copies.
[tool.hatch.build.targets.wheel.force-include]
"llm-panel" = "llm_panel/_scripts/llm-panel"
"panel-report" = "llm_panel/_scripts/panel-report"
"panel-triage" = "llm_panel/_scripts/panel-triage"
"roster.example.json" = "llm_panel/_scripts/roster.example.json"
"opencode.jsonc" = "llm_panel/_scripts/opencode.jsonc"

# Keep the sdist to the tools -- the recall/ benchmark tree is repo-only.
[tool.hatch.build.targets.sdist]
include = [
    "/llm-panel",
    "/panel-report",
    "/panel-triage",
    "/claimlib.py",
    "/roster.example.json",
    "/opencode.jsonc",
    "/src",
    "/README.md",
    "/LICENSE",
]
